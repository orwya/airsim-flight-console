<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101415" />
  <meta name="description" content="AirSim 应用窗口与实时天气控制台" />
  <title>AirSim 飞行控制台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body data-xpra-url="{{ xpra_url }}" data-scene-control="true">
  <aside class="rail">
    <button class="rail-button active" data-icon="dashboard" aria-label="飞行控制台" title="飞行控制台"></button>
    <button class="rail-button" data-icon="route" data-modal="missions" aria-label="任务记录" title="任务记录"></button>
    <button class="rail-button" data-icon="folder" data-modal="media" aria-label="媒体库" title="媒体库"></button>
  </aside>

  <div class="app-shell">
    <main>
      <div class="console-toolbar"><button class="outline-button" id="connect"><span data-icon="link"></span><span id="connect-label">连接 AirSim</span><span class="small-arrow">↗</span></button></div>

      <div class="workspace">
        <div class="flight-column">
          <section class="viewport-card" aria-label="无人机模拟画面">
            <div class="viewport-top"><div class="view-label"><span class="dot"></span>飞行视窗<span class="subtle">/</span><span class="camera-label">FPV CAMERA</span></div><div class="external-view-actions"><span class="preview-label" id="view-mode-label">xpra 远程窗口</span><button class="icon-button" id="capture" data-icon="camera" title="保存演示画面信息" aria-label="保存演示画面信息"></button><button class="icon-button" id="fullscreen" data-icon="expand" title="全屏画面" aria-label="全屏画面"></button></div></div>
            <div class="viewport" id="viewport" data-scene="mountain"><div class="landscape" role="img" aria-label="等待连接 AirSim 画面"></div><iframe id="xpra-frame" tabindex="0" title="AirSim xpra 远程画面" allow="fullscreen" referrerpolicy="no-referrer" hidden></iframe><div id="scene-overlay" class="scene-overlay" hidden><span id="scene-overlay-text">请选择场景启动</span></div></div>
            <div class="viewport-footer"><span><span class="dot muted-dot"></span><span id="feed-status" role="status">等待打开 xpra 客户端</span></span><div class="feed-actions"><button id="focus-feed" title="返回画面接收键盘输入；鼠标视角请点击画面">恢复控制</button><button id="retry-feed">重试</button><a id="open-feed" target="_blank" rel="noopener noreferrer">独立打开 ↗</a><button id="disconnect-feed">断开画面</button></div></div>
          </section>

          <section class="command-card">
            <div class="section-title"><h2><span data-icon="terminal"></span>飞行指令</h2><span class="keyboard-hint">Enter 发送</span></div>
            <form id="command-form"><label class="sr-only" for="command">输入无人机飞行指令</label><span class="prompt-symbol">⌘</span><input id="command" autocomplete="off" maxlength="250" placeholder="描述你想执行的任务，例如：起飞并上升至 20 米…"/><button class="send-button" type="submit">发送指令<span data-icon="arrow"></span></button></form>
            <div class="suggestions"><span>试一试</span><button data-command="起飞并上升至 20 米">↗ 起飞至 20m</button><button data-command="环绕当前目标飞行一周">◎ 环绕飞行</button><button data-command="返回起飞点并降落">⌂ 返航降落</button></div>
            <div class="command-feedback" id="command-feedback" role="status"></div>
          </section>
          <div class="bottom-note"><span data-icon="shield"></span>每一次探索，都从安全出发。<span>飞行指令接口待接入，当前仅展示远程窗口。</span></div>
        </div>

        <aside class="control-column">
          <section class="panel environment-panel option-panel">
            <div class="section-title"><h2>环境控制</h2></div>
            <p class="panel-description">选择环境，后台将停止旧场景并启动目标场景。</p>
            <div class="list-summary"><span>场景列表</span><span id="scene-count"></span></div>
            <div class="option-list" id="scene-list" role="group" aria-label="环境列表" tabindex="0"></div>
            <p id="scene-status" class="weather-status" role="status">正在读取场景状态…</p>
            <button id="cleanup-scene" class="scene-cleanup">停止并清理</button>
          </section>
          <section class="panel weather-panel option-panel">
            <div class="section-title"><h2>天气条件</h2></div>
            <p class="panel-description">选择天气，实时应用至 AirSim。</p>
            <div class="list-summary"><span>天气列表</span><span id="weather-count"></span></div>
            <div class="option-list" id="weather-list" role="group" aria-label="天气列表" tabindex="0"></div>
            <p id="airsim-status" class="weather-status" role="status">正在检查 AirSim RPC…</p>
            <p id="weather-status" class="weather-status" role="status">等待连接后应用默认天气：晴朗</p>
          </section>
        </aside>
      </div>
    </main>
    <footer class="app-footer"><span><span class="dot"></span>ALL SYSTEMS READY FOR EXPLORATION</span><span>DESIGNED FOR THE SKY <span class="footer-star">✳</span></span></footer>
  </div>
  <dialog id="modal"><div class="modal-top"><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" data-icon="close" aria-label="关闭弹窗"></button></div><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='scenes.js') }}"></script>
</body>
</html>
